[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dsdnet-receipt"
version = "1.0.0"
description = "ClearReceipt: offline thermal receipt recovery with evidence-aware review (DSDNet-Receipt pipeline)"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

